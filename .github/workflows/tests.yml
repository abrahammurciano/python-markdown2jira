name: Tests
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Run Tests
        run: uv run pytest tests/
      - name: Ruff Lint
        run: uv run ruff check .
      - name: Ruff Format Check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy .
      - name: Basedpyright
        run: uv run basedpyright
