[project]
name = "markdown2jira"
# Version is overwritten at build time by CI based on git tag
version = "0+dev"
description = "Convert Markdown to Jira wiki markup"
authors = [{ name = "Abraham Murciano", email = "abrahammurciano@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["markdown", "jira", "wiki markup", "confluence"]
dependencies = ["wenmode>=0.15.1"]

[project.urls]
repository = "https://github.com/abrahammurciano/python-markdown2jira"
documentation = "https://abrahammurciano.github.io/python-markdown2jira/markdown2jira"

[dependency-groups]
dev = ["basedpyright", "mypy", "pdoc3", "pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["markdown2jira"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.mypy]
exclude = [".venv", "venv"]

[tool.basedpyright]
reportUnusedCallResult = "none"
reportAny = "none"
reportIncompatibleUnannotatedOverride = "warning"
reportUnannotatedClassAttribute = "none"
reportUnusedParameter = "none"
reportCallInDefaultInitializer = "none"
reportExplicitAny = "none"
reportInvalidCast = "none"
reportUnknownLambdaType = "none"
reportImportCycles = "hint"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
	"A001",
	"A002",
	"ANN401",
	"C901",
	"COM812",
	"CPY001",
	"D100",
	"D101",
	"D102",
	"D103",
	"D104",
	"D105",
	"D106",
	"D107",
	"D203",
	"D213",
	"D413",
	"E501",
	"EM101",
	"EM102",
	"G004",
	"PLC0415",
	"PLR0911",
	"PLR0912",
	"PLR0913",
	"PLR2004",
	"PT013",
	"PYI025",
	"S101",
	"S104",
	"S105",
	"S311",
	"S603",
	"S608",
	"TC001",
	"TC002",
	"TC003",
	"TC006",
	"TD002",
	"TD003",
	"TRY003",
	"TRY400",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-type = "tuple"
parametrize-values-row-type = "tuple"

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["ARG001"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
